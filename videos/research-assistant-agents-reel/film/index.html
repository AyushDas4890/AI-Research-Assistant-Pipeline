<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AI Research Assistant reel</title>
<style>
  /* One display face, one UI face. Point these at the brand's real files in assets/fonts/ (capture.mjs lists them). */
  /* the app's own face (served by Streamlit): Source Sans for display and UI */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/source-sans-100_900.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/source-sans-100_900.woff2) format('woff2'); font-weight: 100 900; }
  :root {
    /* style guide tokens: ONE accent unless the brief says otherwise */
    /* measured from the Streamlit app (docs/style_guide.md) */
    --bg: #f0f2f6; --ink: #31333f; --ink-2: #808495; --accent: #ff4b4b; --card: #ffffff; --code: #f8f9fb;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--bg); transform-origin: 0 0;
           font-family: 'UI', 'Helvetica Neue', Arial, sans-serif; color: var(--ink);
           -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .display { font-family: 'Display', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; letter-spacing: -0.02em;
             line-height: 0.95; white-space: nowrap; }
  /* a line is a mask: words rise through it. Padding keeps descenders; start words >= 140% below so no sliver shows. */
  .line { position: absolute; overflow: hidden; padding: 0.08em 0.04em 0.18em; margin: -0.08em -0.04em 0; white-space: nowrap; }
  .word { display: inline-block; }
  .ui { font-family: 'UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; letter-spacing: -0.01em; line-height: 1.05; white-space: nowrap; }
  .card { position: absolute; background: var(--card); border-radius: 18px;
          box-shadow: 0 2px 6px rgba(49,51,63,.06), 0 40px 90px -30px rgba(49,51,63,.30); }
  /* a window onto a real UI capture: the card clips, the capture inside is moved/scaled by the camera */
  .win { overflow: hidden; }
  .win img { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: block; }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="geo.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="film.js"></script>
</body>
</html>
